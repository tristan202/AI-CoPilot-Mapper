; AI Copilot Mapper - profiler pr. app
; Sæt Count til antal aktive profiler, og udfyld felterne nedenfor.
; Process er exe-navnet på det aktive program, f.eks. notepad.exe, code.exe eller firefox.exe.
; Mode: -1=arv standard, 0=AI, 1=Højre CTRL, 2=Højre ALT
; LaunchMode: -1=arv standard, 0=app-vindue, 1=normal fane, 2=nyt vindue, 3=systemstandard
; Paused: -1=arv standard, 0=aktiv, 1=pause mapping for denne app

[Profiles]
Count=0

